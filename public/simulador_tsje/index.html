<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Simulador Offline</title>
    <style>
        body,html,iframe{width:100%;height:100%;margin:0;padding:0;border:none;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;}
        #splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff; /* Fondo blanco, cambialo si prefieres otro color */
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease-out;
        }
        #splash img {
            max-width: 80%;
            max-height: 80%;
        }
    </style>
</head>
<body>
    <div id="splash">
        <!-- Reemplaza splash.png por el nombre de tu imagen si es diferente -->
        <img src="splash.png" alt="Cargando..." />
    </div>
    <iframe src="app.html?ubicacion=59.0.0"></iframe>
    <script>
        // Ocultar el splash screen despues de 3 segundos (3000 milisegundos)
        setTimeout(function() {
            var splash = document.getElementById('splash');
            splash.style.opacity = '0'; // Efecto de desvanecimiento
            setTimeout(function() {
                splash.style.display = 'none'; // Quitarlo completamente
            }, 500); // Esperar que termine el desvanecimiento (medio segundo)
        }, 3000); 
    </script>
</body>
</html>
